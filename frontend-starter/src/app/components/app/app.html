<header>
  <a routerLink="/tracks" class="logo">mash</a>
  <nav aria-label="Navigation principale">
    @if (auth.currentUser()) {
      <a routerLink="/tracks" routerLinkActive="active" class="nav-link">
        <ng-icon name="lucideMusic" class="nav-icon" />
        <span>Library</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-link">
        <ng-icon name="lucideUser" class="nav-icon" />
        <span>Profile</span>
      </a>
      <button type="button" class="nav-link logout-btn" (click)="logout()">
        <ng-icon name="lucideLogOut" class="nav-icon" />
        <span>Logout</span>
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" class="nav-link">Connexion</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<z-sonner theme="dark" position="bottom-right" [richColors]="true" />
