<section class="profile-page animate-fade-in-up">
  <div class="hero">
    <p class="eyebrow">MY ACCOUNT</p>
    <h1>Profile</h1>
    <p class="hero-sub">Manage your account settings and preferences.</p>
  </div>

  <div class="profile-content">
    <z-card class="profile-card">
      <z-card-header>
        <z-card-title>
          <div class="card-title-row">
            <ng-icon name="lucideUser" class="title-icon" />
            <span>Personal Information</span>
          </div>
        </z-card-title>
        <z-card-description>Update your display name here.</z-card-description>
      </z-card-header>

      <z-card-content>
        @if (loading()) {
          <div class="skeleton-form"></div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="save()" class="profile-form">
            <div class="field">
              <label class="field-label" for="profile-name">Name</label>
              <input
                id="profile-name"
                class="mash-input"
                type="text"
                formControlName="name"
                placeholder="Your name"
              />
              @if (form.controls.name.invalid && form.controls.name.touched) {
                <span class="field-error">Name is required.</span>
              }
            </div>
            
            <div class="field">
              <label class="field-label">Email (Read only)</label>
              <input class="mash-input disabled" type="email" [value]="auth.currentUser()?.email" disabled />
            </div>
          </form>
        }
      </z-card-content>

      <z-card-footer>
        <button z-button (click)="save()" [disabled]="form.invalid || loading() || saving()" [zLoading]="saving()">
          @if (!saving()) {
            <ng-icon name="lucideSave" />
          }
          Save Changes
        </button>
      </z-card-footer>
    </z-card>
  </div>
</section>
